[workspace]
members = ["programs/*"]
resolver = "2"

# platform-tools v1.51 ships rustc/cargo 1.84, which cannot parse edition2024
# manifests. The lockfile pins zeroize 1.8.2, zeroize_derive 1.4.2, blake3 1.8.2,
# constant_time_eq 0.3.1, proc-macro-crate 3.2.0, indexmap 2.11.4, and
# unicode-segmentation 1.12.0. Don't `cargo update` without re-running `anchor build`.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
